<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AlmEly Randevu Portalı - Trabzon">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AlmEly Randevu Portalı">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AlmEly Randevu Portalı</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC55S5CY0E_WxTmwq-TvpF2Tp_yrBdrQb8&libraries=places&language=tr"></script>

  <script>
    function getWebLocation(onSuccess, onError) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            onSuccess(position.coords.latitude, position.coords.longitude);
          },
          function(error) {
            onError(error.message || "Konum alınamadı");
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        onError("Tarayıcı geolocation desteklemiyor");
      }
    }

    // Flutter web: Google Places Autocomplete (Maps ile aynı kaynak)
    function placesAutocomplete(input, lat, lon, onSuccess, onError) {
      try {
        if (!window.google || !google.maps || !google.maps.places) {
          onError('Places kütüphanesi yüklenmedi');
          return;
        }
        var service = new google.maps.places.AutocompleteService();
        service.getPlacePredictions({
          input: input,
          componentRestrictions: { country: 'tr' },
          location: new google.maps.LatLng(lat, lon),
          radius: 50000,
          language: 'tr'
        }, function(predictions, status) {
          if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions) {
            onSuccess('[]');
            return;
          }
          var mapped = predictions.map(function(p) {
            var main = (p.structured_formatting && p.structured_formatting.main_text) || p.description || '';
            var secondary = (p.structured_formatting && p.structured_formatting.secondary_text) || '';
            return {
              main: main,
              secondary: secondary,
              description: p.description || '',
              placeId: p.place_id || ''
            };
          });
          onSuccess(JSON.stringify(mapped));
        });
      } catch (e) {
        onError(String(e));
      }
    }

    // place_id → lat/lon
    function getPlaceLatLng(placeId, onSuccess, onError) {
      try {
        if (!window.google || !google.maps || !google.maps.places) {
          onError('Places yok');
          return;
        }
        var el = document.createElement('div');
        var service = new google.maps.places.PlacesService(el);
        service.getDetails({
          placeId: placeId,
          fields: ['geometry']
        }, function(place, status) {
          if (status === google.maps.places.PlacesServiceStatus.OK &&
              place && place.geometry && place.geometry.location) {
            onSuccess(JSON.stringify({
              lat: place.geometry.location.lat(),
              lon: place.geometry.location.lng()
            }));
          } else {
            onError(String(status));
          }
        });
      } catch (e) {
        onError(String(e));
      }
    }

    // Araç yolu mesafesi (Directions)
    function getDrivingRoute(oLat, oLon, dLat, dLon, onSuccess, onError) {
      try {
        if (!window.google || !google.maps) {
          onError('Maps yok');
          return;
        }
        var service = new google.maps.DirectionsService();
        service.route({
          origin: { lat: oLat, lng: oLon },
          destination: { lat: dLat, lng: dLon },
          travelMode: google.maps.TravelMode.DRIVING,
          language: 'tr',
          region: 'TR'
        }, function(result, status) {
          if (status === 'OK' && result.routes && result.routes[0] &&
              result.routes[0].legs && result.routes[0].legs[0]) {
            var leg = result.routes[0].legs[0];
            onSuccess(JSON.stringify({
              meters: leg.distance.value,
              seconds: leg.duration.value,
              distanceText: leg.distance.text,
              durationText: leg.duration.text
            }));
          } else {
            onError(String(status));
          }
        });
      } catch (e) {
        onError(String(e));
      }
    }
  </script>
</head>
<body>
<script>
  // Logoların geri gelmesi için bunu "canvaskit" yapıyoruz
  window.flutterWebRenderer = "canvaskit";
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
